algorithm:
  class_name: SAC
  # -- Discount and target update
  gamma: 0.99
  tau: 0.005  # soft target update coefficient

  # -- Learning rates
  actor_lr: 0.0003
  critic_lr: 0.0003
  alpha_lr: 0.0003  # entropy coefficient learning rate

  # -- Entropy regularization
  alpha: 0.2  # initial entropy coefficient
  auto_entropy_tuning: true  # automatically tune entropy coefficient
  target_entropy: null  # if null, set to -target_entropy_scale * dim(action_space)
  target_entropy_scale: 1.0  # scale on the -dim(action) heuristic when target_entropy is null

  # -- Optimizer
  optimizer: adam  # adam | adamw
  weight_decay: 0.0  # weight decay for actor/critic optimizers (not applied to alpha)

  # -- Training
  batch_size: 256
  num_updates_per_step: 1  # gradient steps per environment step

  # -- Network
  hidden_dims: [256, 256]

policy:
  class_name: SACActorCritic
  # Actor/critic networks are configured via *_kwargs dicts (flat keys are ignored).
  actor_kwargs:
    hidden_dims: [256, 256]
    activation: relu
    log_std_min: -20
    log_std_max: 2
    init_noise_std: 1.0    # initial action std; also sets log_std-head bias when head_init=tuned
    head_init: default     # default | zero | tuned (tuned mirrors rsl_rl_sac actor init)
  critic_kwargs:
    hidden_dims: [256, 256]
    activation: relu

runner:
  # -- Collection
  num_steps_per_env: 1  # steps per environment per iteration
  max_iterations: 1000000  # total environment steps (for off-policy, this is steps not iterations)

  # -- Replay buffer
  max_size: 1000000  # replay buffer size

  # -- Exploration
  start_random_steps: 1000  # random actions before training starts

  # -- Update schedule
  update_after: 500  # start training after this many steps
  update_every: 1  # update policy every N iterations

  # -- Checkpointing
  save_interval: 10000  # save model every N iterations
  empirical_normalization: false

  # -- Logging
  experiment_name: safety_gymnasium_sac
  run_name: ""
  logger: wandb  # tensorboard, wandb
  wandb_project: SafeRL
  wandb_entity: uqerh-kit
  wandb_dir: ./wandb_logs  # custom wandb directory (default: ./wandb)

  # -- Load and resume
  load_run: -1
  resume_path: null
  checkpoint: -1

runner_class_name: OffPolicyRunner
seed: 1
