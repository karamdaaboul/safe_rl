runner_class_name: OffPolicyRunner
seed: 1

# ===========================================================================
# Paper-aligned SAC variant of unitree_g1_flat_sac_ne4096.yaml (RSL-RL-SAC).
# Differences vs the ne4096 baseline, addressing the paper's recipe:
#   1. target_entropy: 0.0 -> null + target_entropy_scale: 0.167
#      (0.0 drove entropy toward ~0; paper uses -0.167*dim(A) ~= -4.8).
#   2. Calibrated actor init: head_init=tuned + init_noise_std=0.15 (sigma_0),
#      with log_std_squash=clamp so the log_std bias log(0.15) yields std~=0.15
#      directly (tanh squash would remap it to ~0.007).
# Use with --bounded_actions for the full failure-mode-#1 fix. The timeout
# pre-reset observation correction (failure mode #2) is now handled env-side
# in MjlabVecEnv and needs no config flag.
# ===========================================================================

algorithm:
  class_name: SAC
  gamma: 0.97
  tau: 0.125
  actor_lr: 0.0003
  critic_lr: 0.0003
  alpha_lr: 0.0003
  alpha: 0.001
  auto_entropy_tuning: true
  target_entropy: null          # was 0.0 -> use -target_entropy_scale * dim(A)
  target_entropy_scale: 0.167   # paper value
  batch_size: 8192
  num_updates_per_step: 8
  policy_frequency: 4
  n_step: 3

policy:
  class_name: SACActorCritic
  actor_type: stochastic
  critic_type: distributional
  num_critics: 2
  actor_obs_normalization: true
  critic_obs_normalization: true
  actor_kwargs:
    hidden_dims: [512, 256, 128]
    activation: silu
    use_layer_norm: true
    head_init: tuned            # paper calibrated init (was zero_init_heads)
    init_noise_std: 0.15        # sigma_0
    log_std_squash: clamp       # direct log_std so log(0.15) -> std~=0.15
    log_std_min: -5.0
    log_std_max: 0.0
  critic_kwargs:
    num_atoms: 101
    v_min: -20.0
    v_max: 20.0
    network_type: mlp
    network_kwargs:
      hidden_dims: [768, 384, 192]
      activation: silu
      layer_norm: true

runner:
  num_steps_per_env: 1
  max_iterations: 100000
  max_size: 1000000
  start_random_steps: 20480
  update_after: 20480
  update_every: 1
  n_step: 3
  reward_normalization: true
  reward_normalization_mode: return
  reward_normalization_g_max: 20.0
  save_interval: 2000
  log_interval: 500
  empirical_normalization: false
  experiment_name: unitree_g1_flat_sac_paperfix
  run_name: ""
  logger: wandb
  wandb_project: mjlab
