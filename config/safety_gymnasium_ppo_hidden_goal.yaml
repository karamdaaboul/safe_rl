algorithm:
  class_name: PPO
  # training parameters
  # -- advantage normalization
  normalize_advantage_per_mini_batch: false
  # -- value function
  value_loss_coef: 1.0
  clip_param: 0.2
  use_clipped_value_loss: true
  # -- surrogate loss
  desired_kl: 0.01
  entropy_coef: 0.01
  gamma: 0.99
  lam: 0.95
  max_grad_norm: 1.0
  # -- training
  learning_rate: 0.001
  num_learning_epochs: 10
  num_mini_batches: 32  # mini batch size = num_envs * num_steps / num_mini_batches
  schedule: adaptive  # adaptive, fixed

  # -- Random Network Distillation
  rnd_cfg:
      weight: 0.0  # initial weight of the RND reward
      weight_schedule: null
      reward_normalization: false  # whether to normalize RND reward
      state_normalization: true  # whether to normalize RND state observations
      learning_rate: 0.001  # learning rate for RND
      num_outputs: 1  # number of outputs of RND network
      predictor_hidden_dims: [-1] # hidden dimensions of predictor network
      target_hidden_dims: [-1]  # hidden dimensions of target network

  # -- Symmetry Augmentation
  symmetry_cfg:
    use_data_augmentation: true  # this adds symmetric trajectories to the batch
    use_mirror_loss: false  # this adds symmetry loss term to the loss function
    data_augmentation_func: null
    mirror_loss_coeff: 0.0

policy:
  class_name: ActorCritic
  actor_type: gaussian
  critic_type: standard
  actor_kwargs:
    hidden_dims: [128, 128, 128]
    activation: elu
    init_noise_std: 1.0
    noise_std_type: scalar  # 'scalar' or 'log'
  critic_kwargs:
    hidden_dims: [128, 128, 128]
    activation: elu

runner:
    num_steps_per_env: 2048  # number of steps per environment per iteration
    max_iterations: 600  # number of policy updates
    empirical_normalization: false
    # -- logging parameters
    save_interval: 25  # frequent checkpoints: slow run, want recoverable models
    experiment_name: ppo_hidden_goal_count
    run_name: ""
    # -- logging writer
    logger: wandb  # tensorboard, wandb
    wandb_project: SafeRL
    wandb_entity: uqerh-kit
    # -- load and resuming
    load_run: -1  # -1 means load latest run
    resume_path: null  # updated from load_run and checkpoint
    checkpoint: -1  # -1 means load latest checkpoint

runner_class_name: OnPolicyRunner
seed: 1
