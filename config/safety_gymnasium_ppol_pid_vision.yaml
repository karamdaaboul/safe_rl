# PPOL-PID on Safety-Gymnasium *Vision-v0 envs with a frozen pretrained encoder
# (Phase-1 vision path). The actor consumes [encoder features, proprio] emitted
# by VisionFeatureWrapper (~536-d with resnet18 at 64x64); the reward and cost
# critics train asymmetrically on the full ground-truth state that the vec env
# surfaces via extras["observations"]["critic"].
#
# Run (PPO-PID was the best constrained method on the vision-only HASARD
# benchmark, ICLR 2025):
#   python scripts/train/train_safety_gymnasium.py --env_id SafetyCarGoal1Vision-v0 \
#     --num_envs 16 --config config/safety_gymnasium_ppol_pid_vision.yaml --cost_limits 25.0
algorithm:
  class_name: PPOL_PID
  # training parameters
  normalize_advantage_per_mini_batch: false
  value_loss_coef: 1.0
  clip_param: 0.2
  use_clipped_value_loss: true
  desired_kl: 0.02
  entropy_coef: 0.0
  gamma: 0.99
  lam: 0.95
  max_grad_norm: 40.0
  learning_rate: 0.0003
  num_learning_epochs: 40
  num_mini_batches: 4
  schedule: adaptive

  # PPOL-PID specific parameters (aligned with OmniSafe CPPOPID)
  lagrangian_pid: [0.1, 0.01, 0.01]  # [Kp, Ki, Kd]
  lambda_init: [0.001]
  lambda_max: 100.0
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95
  pid_d_delay: 10
  sum_norm: true
  diff_norm: false

  # Cost critic loss
  cost_loss_coef: 1.0
  use_clipped_cost_loss: true

  # Disable extra features by default
  rnd_cfg: null
  symmetry_cfg: null

policy:
  class_name: ActorCriticCost
  actor_type: gaussian
  critic_type: standard
  actor_kwargs:
    hidden_dims: [256, 256]  # wider first stage for the ~536-d feature input
    activation: elu
    init_noise_std: 1.0
    noise_std_type: scalar
  critic_kwargs:
    hidden_dims: [128, 128, 128]  # critics see the compact ground-truth state
    activation: elu
  cost_critic_kwargs:
    hidden_dims: [256, 256, 256]
    activation: elu

runner:
  # Rendering makes env steps ~an order of magnitude slower than state-only
  # training; shorter rollouts keep iteration latency and memory reasonable.
  num_steps_per_env: 512
  max_iterations: 500
  empirical_normalization: false
  save_interval: 100
  experiment_name: safety_gymnasium_ppol_pid_vision
  run_name: ""
  logger: wandb
  wandb_project: SafeRL
  wandb_entity: uqerh-kit
  load_run: -1
  resume_path: null
  checkpoint: -1

runner_class_name: OnPolicyRunner
seed: 1
