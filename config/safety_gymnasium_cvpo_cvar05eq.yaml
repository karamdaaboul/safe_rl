# MPO — Maximum a Posteriori Policy Optimization (Abdolmaleki et al., ICLR 2018)
# Off-policy EM actor-critic. Reuses the SAC twin reward critics + replay buffer; the
# actor update is the MPO E-step (per-batch convex dual over the temperature eta ->
# non-parametric weights) + M-step (weighted MLE under decoupled mean/cov KL trust
# regions). Unconstrained sibling of CVPO (see config/safety_gymnasium_cvpo.yaml);
# exploration comes from the E-step KL trust region, so SAC entropy is disabled.

# CVaR-CONSTRAINED variant: distributional reward AND cost critics, with the E-step
# constraining CVaR_alpha(Z_c) rather than E[Z_c]. See codex/cvpo-cost-critic-investigation.md (scalar 1-step Q_c is
# near-constant: calibration slope 0.094 over a true range of 0-38).
# Support [-5, 15]: SafetyPointGoal1 converges near reward ~27/episode (per-step ~0.027,
# gamma 0.99 -> Q ~ 2.7), so ~5x headroom against HL-Gauss edge clipping.
algorithm:
  class_name: CVPO
  # -- Discount and target update
  gamma: 0.99
  tau: 0.005

  # -- Learning rates
  actor_lr: 0.0003
  critic_lr: 0.0003

  # -- Training
  batch_size: 256
  num_updates_per_step: 2   # with num_steps_per_env: 4 -> UTD ~8 at 16 envs (~16 at 8 envs)
  max_grad_norm: 1.0

  # -- Passive cost critic (this is DMPO, not CVPO)
  # CVPO with lambda pinned at 0: the E-step weight is exp((Q_r - 0*Q_c)/eta) = exp(Q_r/eta),
  # i.e. exactly the unconstrained MPO E-step. Q_c is trained every update but never enters
  # the actor objective, the M-step or the dual. The point is to measure whether a
  # distributional cost critic can learn Q_c at all, with the policy held to the DMPO
  # trajectory distribution -- no confound from the cost signal reshaping the policy.
  cost_critic_passive: false
  # WCSAC-style risk constraint: constrain CVaR of the cost return instead of its mean.
  # CVaR is read exactly off the categorical atoms -- no Gaussian fit, no variance head.
  # Measured on the pretrained agent (512 states x 64 candidate actions):
  #   mean E[Z_c] 4.45 = 1.78x qc_thres,  CVaR_0.5 6.89 = 2.75x,  CVaR_0.9 11.19 = 4.48x
  # and CVaR carries 1.36-1.64x more per-state action spread than the mean, i.e. the E-step
  # gets MORE to discriminate on.
  cost_constraint_mode: cvar
  cvar_alpha: 0.5
  # Budget-equivalent threshold: 2.50 (mean budget in Q-space) x 1.55 (measured
  # CVaR_0.5/mean ratio) = 3.875. Without this the constraint is unsatisfiable and
  # lambda simply pins at lambda_max, i.e. a fixed penalty rather than a controller.
  qc_thres: 3.875
  lambda_mode: grad
  lambda_max: 4.0           # sized from the measured E-step scale; 100 made cost 128x reward
  lambda_lr: 0.03
  cost_limits: [25.0]       # required by the SafeSAC base; unused while passive
  cost_horizon: 1000

  # -- MPO E-step
  sample_action_num: 64     # candidate actions sampled per state (Acme/RL-X use 20)
  dual_constraint: 0.1      # E-step KL bound (eps in the dual)
  estep_use_target_critic: true    # score candidates with the target critics (Acme)
  estep_q_reduction: mean          # twin mean, not min-pessimism (Acme)

  # -- MPO M-step (decoupled KL trust regions)
  # Per-dimension trust regions (Acme's default): eps below is PER ACTION DIM —
  # divide the joint budget (0.01 / 1e-4) by the env's action dim when porting.
  per_dim_constraining: true
  kl_mean_constraint: 0.005      # = 0.01 / 2 action dims (Point/Car robots)
  kl_var_constraint: 0.00005     # = 1e-4 / 2 action dims
  decoupled_mstep: true          # split weighted MLE like the KL (mean at old std)
  alpha_mean_scale: 1.0
  alpha_var_scale: 100.0
  # alpha_mean_max / alpha_var_max: left at the code defaults (10 / 1000). These are
  # overflow guards; the old 0.1 / 10 values pinned the multipliers and disabled the
  # M-step trust region (see codex/mpo-vs-acme-reference.md).
  mstep_iteration_num: 5
  # Target actor: plain Polyak (default). The hard periodic copy doubles early learning
  # speed but cost final policy quality in the 3-seed paired Humanoid-Flat ablation
  # (deterministic eval 55.1+-7.3 vs 67.0+-8.5 for Polyak, Polyak ahead on all 3 seeds).

policy:
  class_name: SafeActorCritic   # distributional reward critics + a distributional cost critic
  critic_type: distributional
  cost_critic_type: distributional
  num_costs: 1
  actor_kwargs:
    hidden_dims: [256, 256]
    activation: relu
    log_std_min: -20
    log_std_max: 2
  critic_kwargs:
    num_atoms: 101
    v_min: -5.0
    v_max: 15.0
    network_kwargs:
      hidden_dims: [256, 256]
      activation: relu
  cost_critic_kwargs:
    # One-sided support: cost is non-negative, so v_min=0 makes a negative Q_c structurally
    # impossible (the scalar head needed a softplus patch for this). v_max=50 covers the
    # measured MC cost-to-go, whose max over 100k visited states was 38.5.
    num_atoms: 101
    v_min: 0.0
    v_max: 50.0
    network_kwargs:
      hidden_dims: [256, 256]
      activation: relu

runner:
  num_steps_per_env: 4
  max_iterations: 15000     # reward is flat past ~13k on SafetyPointGoal1 (3-step reaches
                            # 22 by iter 6k vs ~8k for 1-step); 30k added nothing measurable
  max_size: 1000000
  start_random_steps: 5000
  update_after: 5000
  update_every: 1
  # NOTE: this key was silently dropped before 2026-08-04 -- train_safety_gymnasium.py built
  # the runner config from a whitelist that omitted n_step, so every run predating that fix
  # trained 1-step regardless of this setting (including the 2026-08-02 DMPO runs).
  n_step: 3
  save_interval: 5000
  empirical_normalization: false
  experiment_name: safety_gymnasium_cvpo_cvar05eq
  run_name: ""
  logger: wandb
  wandb_project: SafeRL
  wandb_entity: uqerh-kit
  wandb_dir: ./wandb_logs
  load_run: -1
  resume_path: null
  checkpoint: -1
  log_interval: 1000

runner_class_name: OffPolicyRunner
seed: 1
