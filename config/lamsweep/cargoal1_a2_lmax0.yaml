# CRITIC-LAG EXPERIMENT ARM: a2_lag_cc4
#
# 4 cost-critic updates : 1 actor update
#
# Question: during online training the cost critic's tail collapses (measured on
# s2b_tdlam_L64_lam099_seed2: VaR_0.9 coverage 0.77 vs 0.90 offline, predicted CVaR 42
# vs realized 82). Hypothesis: the actor moves faster than the critic can track.
# Cost target is FIXED at L=64 / lambda=0.995 in every arm; only the update ratio or
# the actor lr changes. Replay, networks, cost limit and qc_thres are untouched.
#
# FH-DCMPO S2b arm — TD(lambda) COST TARGET (SDAC, arXiv:2301.10923).
#
# ONE change from the S1b arm (our best: reward 24.52 / cost 23.04 / 38% violations): the cost
# critic now regresses onto a TD(lambda) mixture of UNDISCOUNTED j-step returns over a 64-step
# window, instead of a single 10-step bootstrapped target.
#
# WHY. Across four arms that changed the constraint statistic, the lambda gains and the loss shape,
# the cost critic's tail stayed 2.2-2.4x too narrow and VaR_0.9 coverage sat at 0.67-0.72 (want
# 0.90) -- see codex/fh-dcmpo-math.md. The one thing none of them changed was the TARGET. With
# gamma_c = 1 the critic learns its tail almost entirely from its own bootstrapped target, so being
# too narrow is self-reinforcing: only 10 steps of real cost variance entered per backup.
#
# SDAC's second stated contribution is exactly this fix -- a TD(lambda) target distribution to
# estimate risk-averse constraints with low bias. EVO reaches the same place from the other side by
# fitting its GPD to real peaks-over-threshold rather than to the critic's prediction. The common
# principle: do not read a tail off a bootstrapped critic.
#
# WINDOW LENGTH IS THE POINT, not lambda. TD(lambda) over the existing 10-step window would be a
# no-op at best: at lambda=1 it reduces exactly to today's target, and below that it mixes in
# SHORTER returns, i.e. less real cost variance. Hence a cost window independent of the reward
# n_step. 64 steps carries 6.4x the real cost variance of the current target, and ~6% of windows
# reach an episode boundary, where the target becomes the exact realized remaining cost with no
# critic error in it at all (logged as `critic_cost_mc_frac`).
#
# Original S1b header follows.
# FH-DCMPO S1b arm — finite horizon ONLY, mean constraint, RE-TUNED lambda gains.
#
# S1 (safety_gymnasium_fhdcmpo_s1_mean_goal1.yaml) over-constrained: cost 0.7 vs a budget of 25
# with reward at 0.95. This arm only changes the lambda controller; see the block below it.
#
# The point of this arm is to isolate the finite-horizon/units change from the risk change.
# If it does not reproduce the qrdmpo mean-cost operating point (18.97 +/- 3.05) then the
# undiscounted critic itself is broken, and any tail result on top of it would be
# uninterpretable. Gate S1 on this before touching kappa.
#
# Original header follows.
# FH-DCMPO — Finite-Horizon Distributional Constrained MPO, SafetyPointGoal1-v0.
#
# Clone of safety_gymnasium_qrdmpo_goal1.yaml (the current best safety point: reward 23.84,
# cost 18.97, CVaR_0.9 56.9, 32.0% of episodes over budget, 3 seeds) with the finite-horizon
# distributional cost constraint substituted in. Everything not listed below is byte-identical
# to that arm on purpose -- the comparison is only interpretable if the cost formulation is the
# sole difference.
#
# WHAT CHANGED, and why each one is load-bearing:
#
#  1. `env.kwargs.horizon_feature: true` -- appends u = (T-t)/T to the observation. Without it
#     the undiscounted cost-to-go is not a function of (s, a) and the regression has no fixed
#     point. This changes the observation dimension, so checkpoints from other arms will not load.
#
#  2. `qc_thres: 25.0` -- the threshold IS the cost limit. No qc_scale. The discounted arms had to
#     map 25 into cost-Q space through a per-task scalar (0.0764 on PointGoal1, 0.09198 on
#     CarGoal1); getting it wrong moved the real budget 20-31% with no visible symptom.
#
#  3. `fh_*` -- the conservatism statistic rho = E[Z_c] + kappa*(CVaR_alpha[Z_c] - E[Z_c]).
#     kappa ramps 0 -> 1 so the constraint starts satisfiable. Jumping straight to CVaR_0.9 is
#     what killed the earlier attempt: it sat 4.48x above the threshold from iteration 0, lambda
#     pinned at its cap for 13k of 15k iterations, and the E-step degenerated to "minimise cost,
#     ignore reward" (codex/why-mean-beat-cvar-on-pointgoal1.md).
#
#  4. The lambda gains are UNCHANGED from the qrdmpo arm, which is not obvious and was measured
#     rather than assumed -- see the block above the controller settings below. rho_c is ~13x
#     larger than Q_c in LEVEL, but lambda's balance point depends on the ratio of action
#     SPREADS, and those are comparable. A first draft rescaled every gain by 1/13 and capped
#     lambda below its own balance point; the S0 smoke caught it.
#
# Not set, deliberately: `init_at_random_ep_len`. It would desynchronize the envs so a single
# collection step spans several u values, but this script does not plumb it, and it is not needed
# -- `empirical_normalization: false` here (so nothing normalizes the u column away) and uniform
# replay over a 1M buffer already covers every u.

algorithm:
  class_name: FHDCMPO

  # -- Discount and target update. gamma is the REWARD discount; the cost channel is
  # undiscounted (gamma_c = 1) and that is not configurable -- it is what the algorithm is.
  gamma: 0.99
  tau: 0.005

  # -- Learning rates
  actor_lr: 0.0003
  critic_lr: 0.0003
  cost_critic_lr: 0.0003

  # -- Training
  batch_size: 256
  num_updates_per_step: 2
  max_grad_norm: 1.0

  # -- CVPO E-step
  sample_action_num: 64
  dual_constraint: 0.1

  # -- CVPO M-step (decoupled KL trust regions, MPO-style)
  kl_mean_constraint: 0.01
  kl_var_constraint: 0.0001
  alpha_mean_scale: 1.0
  alpha_var_scale: 100.0
  alpha_mean_max: 8.0
  alpha_var_max: 10.0
  mstep_iteration_num: 5

  # -- Cost constraint, in TRUE episodic units
  cost_limits: [25.0]
  cost_horizon: 1000        # T, for reporting only -- no longer a scale factor
  qc_thres: 25.0            # == cost_limit. Set explicitly so a future default change cannot
                            # silently reintroduce a qc_scale conversion.
  qc_thres_adapt: false

  # -- THE single change from S1b.
  cost_n_step: 64           # cost window length; must exceed runner.n_step (10) or it is a no-op
  cost_critic_updates_per_step: 4   # extra cost-critic steps, each on a FRESH batch; actor/reward critic untouched
  cost_td_lambda: 0.995     # FIXED across every arm of the critic-lag experiment (L=64).

  # -- The finite-horizon distributional statistic
  fh_risk_mode: mean        # S1: finite horizon, NO tail statistic. kappa is forced to 0.
  fh_alpha: 0.9             # constrain the worst 10% of the episodic-cost distribution
  fh_kappa: 1.0             # ramp target: 1.0 = pure CVaR_0.9
  fh_kappa_warmup: 5000     # E-step updates at kappa=0 while the cost critic levels out
  fh_kappa_ramp: 15000      # then linear to fh_kappa over this many updates

  # -- Lambda controller. RE-TUNED after the S1 arm over-constrained (2026-08-17).
  #
  # S1 with the inherited qrdmpo gains drove episodic cost from 56 to 0.7 against a budget of 25,
  # and reward collapsed 9.25 -> 0.95 with goals 4.4 -> 1.2. lambda overshot to its 4.0 cap and sat
  # there for 11-18% of updates before unwinding. That is the idle-policy failure, not a safety win.
  #
  # WHY the old gains are too strong here, with a size rather than a guess: they were tuned against a
  # cost critic that under-read its level by 2.2x (codex/cvpo-cost-critic-investigation.md), so the
  # arm's EFFECTIVE pressure was lambda_max/2.2 ~ 1.8. The finite-horizon critic reads the level
  # correctly (measured ratio 1.20, codex/fh-dcmpo-math.md 7.2), so the same nominal lambda now bites
  # ~2.2x harder. Dividing lambda_max by that factor preserves the old operating point.
  #
  # Ki is also halved: the overshoot came from the integral winding up while cost was ~100, then
  # needing ~10k iterations to unwind. Kd is kept high for damping.
  lambda_source: episodic   # delta from realized J_c, normalized by the limit
  lambda_mode: grad         # eta from the dual solve; lambda from the controller
  lambda_update: pid
  lambda_kp: 0.12           # was 0.25
  lambda_kd: 0.5
  lambda_anti_windup: true
  lambda_init: 0.0
  lambda_episodic_warmup: 5
  lambda_lr: 0.05           # = Ki. Was 0.1: halved to stop the integral winding up.
  lambda_max: 0.0            # arm: unconstrained control

policy:
  class_name: SafeActorCritic
  critic_type: quantile
  # Quantile cost critic is REQUIRED, not a choice: the categorical head hard-clips its support
  # at v_max (50.0 by default) and undiscounted episodic costs run well past that. FHDCMPO raises
  # if this is anything else.
  cost_critic_type: quantile
  num_costs: 1
  actor_kwargs:
    hidden_dims: [256, 256]
    activation: relu
    log_std_min: -20
    log_std_max: 2
  critic_kwargs:
    n_quantiles: 64
    kappa: 1.0
    nonneg: false
    tqc_drop: 0
    network_kwargs:
      hidden_dims: [256, 256]
      activation: relu
  cost_critic_kwargs:
    n_quantiles: 64
    kappa: 1.0
    nonneg: true            # cost is non-negative; softplus makes a negative rho structurally
                            # impossible rather than merely unlikely
    tqc_drop: 0
    network_kwargs:
      hidden_dims: [256, 256]
      activation: relu

env:
  kwargs:
    horizon_feature: true   # append u = (T - t)/T
    budget_feature: false   # Sauté-style remaining budget; its own ablation, off by default

runner:
  num_steps_per_env: 4
  max_iterations: 60000    # 20k is mid-transient (s2b: reward 14.0 @20k -> 26.1 @60k,
                           # cost peaks ~30k, lambda still drifting). Checkpoints every
                           # 5k, so the 20k comparison point comes free on the way.
  max_size: 1000000
  start_random_steps: 5000
  update_after: 5000
  update_every: 1
  save_interval: 5000
  empirical_normalization: false
  n_step: 10                # in-buffer n-step. The cost window is summed UNDISCOUNTED
                            # (ReplayStorage cost_gamma=1.0, set by the algorithm) -- with
                            # gamma_c=1 there is no contraction, so value information has to
                            # propagate from the u=0 boundary and n=10 is what makes that
                            # tractable. n_step: 1 would work but propagate 10x slower.
  experiment_name: lamsweep_cargoal1_a2_lmax0
  run_name: "cargoal1_a2_lmax0"
  logger: tensorboard
  wandb_project: SafeRL
  wandb_entity: uqerh-kit
  wandb_dir: ./wandb_logs
  load_run: -1
  resume_path: null
  checkpoint: -1
  log_interval: 1000

runner_class_name: OffPolicyRunner
seed: 1
