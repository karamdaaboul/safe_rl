runner_class_name: OnPolicyRunner
seed: 1

# ===========================================================================
# REPPO v34 = v33 + force_last_step_truncated (parity switch 1 of 3).
#
# Sources, both from the TruDi reference:
#   config/experiment_overrides/isaaclab.yaml   (their G1/H1 velocity preset)
#     gamma 0.97 | num_envs 4096 | num_steps 64 | num_mini_batches 16
#     num_epochs 8 | kl_bound 0.1 | critic_hidden_dim 512
#   config/env/isaaclab.yaml
#     reward_scaling 1.0 | vmin -10 | vmax 10        (+ num_bins 151 default)
#
# PARITY SWITCH 1 OF 3: force_last_step_truncated: true. The reference's
# compute_gve does `truncated[-1] = 1.0` IN PLACE, and the critic update reads
# that same buffer -- so the final rollout step (every env, 1/64 of samples here)
# both bootstraps 1-step (no lambda blend, no termination mask) and is dropped
# from the critic loss. Our default kept the real flag. Previously A/B'd inside
# v28 (all three switches at once) and found inert; this isolates it.
# Remaining unset, to be added one per version: critic_loss_denominator: batch,
# dual_optim_mode: actor.
#
# BUDGET: 4096 x 64 x 150 = 39.3M steps -- matched to clean_val and the
# budget-matched PPO, NOT to v33's 157M. Note that at 4096 envs this is only 150
# iterations, i.e. 150 x 8 x 16 = 19,200 gradient updates against a 1024-env
# run's 76,800 at the same sample count. Fewer, larger updates.
#
# THE OTHER INTENTIONAL DIFFERENCE: action_scale 3.0, and mjlab applies no action
# clipping. Their locomotion env sets `action_bounds: 1.0`, so their tanh at +-1
# matches an env that enforces +-1. mjlab Go2 sets clip_actions None, and PPO
# exploits that to command up to +-4.46 -- widening our range was worth ~2x on
# tracking error. tanh is kept rather than raw-Gaussian + clip: a raw Gaussian
# loses the self-limiting property that makes their KL gate work, which this
# repo already falsified in v9.
#
# On reward_scale 1.0 (previously 10.0 here): reward scale and value support are
# the SAME degree of freedom -- scale 10 with [-10,50] is identical to scale 1
# with [-1,5]. mjlab and IsaacLab BOTH scale rewards by dt
# (mjlab/managers/reward_manager.py: reward_buf = raw * weight * dt) and their
# episode returns are comparable (IsaacLab Flat-G1 38.7, Rough-G1 50.3; mjlab
# Go2 ~50), so their [-10,10] applies directly here. At gamma 0.97 Q settles
# near ~1.3, using ~10 of 150 bins -- loose, but it is exactly what produced
# their published 250M-step results over 4 tasks x 10 trials.
#
# 4096 x 64 x 600 = 157.3M steps (~63% of their 250M locomotion budget).
# Gradient steps are set by iterations, not envs: 8 x 16 = 128 per iteration.
#
# init_alpha_temp 0.01, not 1.0 -- and this is still a reference value. The zip
# has `ent_start: 1.0` with `# ent_start: 0.01` commented out directly above it;
# the GitHub snapshot has 0.01 active. The authors ran both.
#
# Why 0.01 is required HERE specifically: the soft reward carries
# -gamma * alpha * log pi(a'|s'), and action_scale 3 adds n*log(3) = 13.2 to the
# entropy, so log pi is 13.2 more negative per state than in a +-1 policy. With
# alpha = 1.0 that bonus is ~7/step against a reward of ~0.05/step -- 140x -- and
# the lambda-return lands near 57 against a support ceiling of 10. Measured: the
# 1.0 run sat at 97% of targets clipped through iteration 133, q_value pinned at
# 9.84, and reward DEGRADED from -10.5 to -48.8, because with all mass in the top
# bin dQ/da carries no signal for the pathwise actor. alpha would not have decayed
# enough until ~iteration 280 of 600. At 0.01 the bonus is ~0.2/step and the
# return lands near 6-7, inside the support from the start.
#
# Watch: q_value should settle near ~1.3, NOT ~10. frac_targets_clipped should
# fall to ~0 within the first few iterations, not stay at 0.97.
# ===========================================================================

algorithm:
  class_name: REPPO
  # -- returns
  gamma: 0.97                     # locomotion preset (was 0.99)
  lam: 0.95
  # -- KL constraint
  desired_kl: 0.1
  kl_clip_mode: clipped
  # -- learned dual variables
  init_alpha_temp: 0.01           # reference ent_start (see header)
  init_alpha_kl: 0.01             # reference kl_start
  target_entropy: -0.5            # = reference ent_target_mult 0.5
  # -- optimizers (reference: plain Adam, one lr, no weight decay)
  optimizer_class: adam
  weight_decay: 0.0
  betas: [0.9, 0.999]
  learning_rate: 0.0003
  alpha_lr: 0.0003
  max_grad_norm: 0.5
  # -- reference-faithful REPPO components
  force_last_step_truncated: true # parity switch 1/3 (reference compute_gve)
  aux_loss_mult: 1.0
  reward_scale: 1.0               # reference env/isaaclab.yaml reward_scaling (see header)
  # -- training
  num_learning_epochs: 8          # locomotion preset
  num_mini_batches: 16            # locomotion preset -> minibatch 4096

policy:
  class_name: REPPOActorCritic
  actor_type: stochastic
  critic_type: reference          # encoder/head-split critic (their Critic)
  actor_obs_normalization: true
  critic_obs_normalization: true
  min_std: 0.0                    # reference actor_min_std
  squash: tanh
  action_scale: 3.0            # v32 LEVER: tanh range (-3,3) instead of (-1,1)
  actor_kwargs:
    network_type: mlp
    hidden_dims: [512, 512]       # reference: 3-layer FCNN @ 512 incl. output
    activation: swish
    use_layer_norm: true
    norm_type: rmsnorm            # reference uses RMSNorm
    log_std_squash: clamp         # reference: plain exp(log_std), unbounded
    log_std_min: -10.0
    log_std_max: 2.0
    init_noise_std: 1.0
  critic_kwargs:
    num_atoms: 151                # reference num_bins
    v_min: -10.0                  # reference env/isaaclab.yaml vmin
    v_max: 10.0                   # reference env/isaaclab.yaml vmax
    hidden_dim: 512               # locomotion preset value (NOT the humanoid's 1024)
    encoder_layers: 2             # reference num_critic_encoder_layers
    head_layers: 2                # reference num_critic_head_layers
    pred_layers: 2                # reference num_critic_pred_layers
    activation: swish
    norm: rmsnorm
    prior_scale: 40.9             # reference: logits + 40.9 * hl_gauss(0)

runner:
  num_steps_per_env: 64           # locomotion preset
  max_iterations: 150             # 4096 x 64 x 150 = 39.3M steps (budget-matched)
  empirical_normalization: false
  save_interval: 50
  experiment_name: mjlab_go2_reppo_v34_lasttrunc
  run_name: ""
  logger: wandb
  wandb_project: mjlab
