# Ant-Flat run of the corrected MPO implementation.
# Based on mjlab_ant_mpo_best.yaml, with uncapped KL multipliers.
# E-step: bracketed KL-constrained temperature solve, target-critic mean scoring.
# M-step: per-dimension constraints and decoupled mean/variance likelihoods.
# Target actor uses Polyak updates (tau=0.005).

runner_class_name: OffPolicyRunner
seed: 1

algorithm:
  class_name: MPO
  gamma: 0.99
  tau: 0.005
  actor_lr: 0.0003
  critic_lr: 0.0003
  batch_size: 256
  num_updates_per_step: 4
  max_grad_norm: 1.0
  sample_action_num: 64
  dual_constraint: 0.1
  estep_use_target_critic: true
  estep_q_reduction: mean
  kl_mean_constraint: 0.00125       # 0.01 / 8 action dimensions
  kl_var_constraint: 0.0000125      # 1e-4 / 8 action dimensions
  alpha_mean_scale: 1.0
  alpha_var_scale: 100.0
  alpha_mean_max: null
  alpha_var_max: null
  mstep_iteration_num: 5
  per_dim_constraining: true
  decoupled_mstep: true

policy:
  class_name: SACActorCritic
  actor_type: stochastic
  critic_type: standard
  num_critics: 2
  actor_obs_normalization: true
  critic_obs_normalization: true
  actor_kwargs:
    hidden_dims: [256, 256]
    activation: relu
    log_std_min: -20
    log_std_max: 2
  critic_kwargs:
    hidden_dims: [256, 256]
    activation: relu

runner:
  num_steps_per_env: 1
  max_iterations: 30000
  max_size: 1000000
  start_random_steps: 5000
  update_after: 5000
  update_every: 1
  save_interval: 2500
  empirical_normalization: false
  experiment_name: mjlab_ant_mpo_corrected
  run_name: corrected_seed1
  logger: wandb
  wandb_project: mjlab
  wandb_entity: uqerh-kit
  wandb_dir: ./wandb_logs
  log_interval: 100
  n_step: 1
  reward_normalization: false
